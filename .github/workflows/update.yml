name: Update deals

on:
  schedule:
    - cron: "23 11 * * *"   # every day ~6:23 AM Columbus time
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh
  push:                      # re-run right away when you change your lists or the code
    branches: [main]
    paths: ["data/watchlist.json", "data/stores.json", "data/baseline.csv", "data/manual_offers.csv", "scripts/**", "docs/index.html"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit new data
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add docs/data.json data/history.json
          git diff --cached --quiet || git commit -m "Daily deals update"
          git push
